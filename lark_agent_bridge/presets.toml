# Built-in AI provider presets for lark-agent-bridge.
#
# Setting ``preset = "..."`` in [ai_provider] auto-fills base_url, model names
# and api_format.  You only need to supply ``api_key`` (or set the env var
# LARK_AGENT_BRIDGE_AI_API_KEY).  Individual fields override the preset.
#
# To add custom presets, create a [provider_presets.<name>] section in your
# config.toml — it will be merged with (and can override) these built-ins.

[xiaomi-tp]
base_url = "https://token-plan-cn.xiaomimimo.com/anthropic"
primary_model = "mimo-v2.5-pro"
fast_model = "mimo-v2.5"
api_format = "anthropic"

[xiaomi-sk]
base_url = "https://api.xiaomimimo.com/anthropic"
primary_model = "mimo-v2.5-pro"
fast_model = "mimo-v2.5"
api_format = "anthropic"

[yybb]
base_url = "https://yybb.codes"
primary_model = "claude-sonnet-4-6"
fast_model = "claude-haiku-4-5-20251001"
fallback_model = "claude-opus-4-6"
api_format = "anthropic"

[yybb-codex]
base_url = "https://yybb.codes"
primary_model = "gpt-5.4"
fast_model = "gpt-5.4-mini"
api_format = "anthropic"

[yybb-codex-openai]
base_url = "https://yybb.codes/v1"
primary_model = "gpt-5.4"
fast_model = "gpt-5.4-mini"
api_format = "openai"

[panda]
base_url = "https://hub.tokenpanda.top/v1"
primary_model = "gpt-5.4"
fast_model = "gpt-4.1-mini"
api_format = "openai"

[codex-official]
base_url = "https://chatgpt.com/backend-api/codex"
primary_model = "gpt-5.4"
fast_model = "gpt-5.4-mini"
api_format = "anthropic"

[cc-switch]
base_url = "http://127.0.0.1:15721"
primary_model = "mimo-v2.5-pro"
fast_model = "mimo-v2.5"
api_format = "anthropic"
api_key = "PROXY_MANAGED"

[openai]
base_url = "https://api.openai.com/v1"
primary_model = "gpt-5.4"
fast_model = "gpt-4.1-mini"
api_format = "openai"

[deepseek]
base_url = "https://api.deepseek.com/v1"
primary_model = "deepseek-chat"
fast_model = "deepseek-chat"
api_format = "openai"
