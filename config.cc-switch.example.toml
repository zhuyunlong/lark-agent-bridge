# lark-agent-bridge config template — cc-switch preset
# 运行: python3 -m lark_agent_bridge listen --config config.cc-switch.toml
# 或:   ./run.sh cc-switch
#
# 此文件是模板，从这里复制: cp config.cc-switch.example.toml config.cc-switch.toml
# 模板参见: config.cc-switch.example.toml

# ------------------------------------------------------------------
# 顶层设置
# ------------------------------------------------------------------
dry_run = false          # 改为 true 则只测试不发消息          # true=仅测试不实际发消息
workspace_root = "../.."
guideengine_repo = "../../xp/guideengine/.worktrees/your_branch"
data_dir = "data"
allowed_chats = []
allowed_users = []

# ------------------------------------------------------------------
# Feishu Bot 身份（凭证由 lark-cli auth 管理，这里只需 ID）
# 也可通过环境变量设置:
#   export LARK_AGENT_BRIDGE_BOT_OPEN_ID=ou_xxx
#   export LARK_AGENT_BRIDGE_BOT_NAME="My Feishu Bot"
# ------------------------------------------------------------------
[lark]
bot_open_id = ""
bot_name = ""

[internal_network_env]
inherit_env = [
  "PATH",
  "HOME",
  "USER",
  "LOGNAME",
  "TMPDIR",
  "TMP",
  "TEMP",
  "LANG",
  "LC_ALL",
  "LC_CTYPE",
  "SHELL",
  "TERM",
  "ANDROID_SDK_ROOT",
  "ANDROID_HOME",
  "JAVA_HOME",
]
unset_env = [
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "ALL_PROXY",
  "NO_PROXY",
  "http_proxy",
  "https_proxy",
  "all_proxy",
  "no_proxy",
]

# ------------------------------------------------------------------
# AI Provider: cc-switch 本地代理
# cc-switch 必须运行在 127.0.0.1:15721
# 在 cc-switch UI 中切换 provider(Claude/Codex/...) 即可改变路由
# 无需 api_key，cc-switch 内部管理 token
# ------------------------------------------------------------------
[ai_provider]
enabled = true
preset = "cc-switch"

# ------------------------------------------------------------------
# Bug 分析（subprocess 阶段用 codex/claude 跑分析脚本）
# [ai_provider] 负责: intent 分类 + 最终 summary
# provider = "codex" 只影响 subprocess 分析阶段，不影响 ai_provider
# ------------------------------------------------------------------
[bug_analysis]
enabled = true
provider = "codex"       # subprocess 分析引擎: "codex" 或 "claude"
timeout_seconds = 5400
agent_summary_timeout_seconds = 300

[intent_analysis]
enabled = true           # 使用 ai_provider 直连做 intent 分类

[claude_agent]
enabled = true
command = "claude"
trigger_prefixes = []
working_dir = "../.."
allowed_tools = ["Read", "Grep", "Glob", "LS"]
permission_mode = "dontAsk"
timeout_seconds = 1800

[source_investigation]
enabled = true
provider = "codex"
timeout_seconds = 120

[omlx_chat]
enabled = true
base_url = "http://127.0.0.1:8000/v1"
model = "gemma-4-26b-a4b-it-4bit"
api_key = ""             # 或 env: LARK_AGENT_BRIDGE_OMLX_API_KEY
timeout_seconds = 120

[knowledge]
enabled = true
storage = "data/knowledge/knowledge.sqlite"
max_hits = 5
trigger_prefixes = ["知识库", "查知识", "/kb", "/qa"]
answer_provider = "omlx"

[report_server]
enabled = true
bind_host = "0.0.0.0"
port = 8765
admin_token = ""         # 或 env: LARK_AGENT_BRIDGE_ADMIN_TOKEN

[approval]
enabled = false

[download]
enabled = true
max_bytes = 5368709120

[job_retention]
enabled = true
max_age_hours = 6

[notifications]
enabled = false
