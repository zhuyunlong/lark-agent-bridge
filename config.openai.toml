# lark-agent-bridge config — OpenAI direct API (no cc-switch needed)
# 运行: python3 -m lark_agent_bridge listen --config config.openai.toml
# 或:   ./run.sh openai

[lark]
enabled = true
# 从飞书机器人平台获取这些值
bot_id = ""
bot_secret = ""
webhook_secret = ""

[ai_provider]
# 直连 OpenAI API，无需 cc-switch
# 获取 API key: https://platform.openai.com/api-keys
# 或设置环境变量: export LARK_AGENT_BRIDGE_AI_API_KEY=sk-...
enabled = true
preset = "openai"
api_key = ""            # 或使用环境变量 LARK_AGENT_BRIDGE_AI_API_KEY

# 可选：配置快速/便宜的模型
# fast_model = "gpt-4.1-mini"

# 可选：配置 fallback (e.g. cc-switch 或 deepseek)
# fallback_base_url = "http://127.0.0.1:15721"
# fallback_api_key = "PROXY_MANAGED"

# 性能调优
intent_timeout_seconds = 30
summary_timeout_seconds = 120
summary_max_tokens = 4096

[bug_analysis]
enabled = true
# 使用 ai_provider 直连，不使用 codex subprocess

[intent_analysis]
enabled = true

[approval]
enabled = true

[report_server]
enabled = true
port = 18888

[download]
enabled = true

[job_retention]
enabled = true

[notifications]
enabled = true
