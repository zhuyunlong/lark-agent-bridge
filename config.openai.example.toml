# lark-agent-bridge config template — OpenAI-compatible preset
# 运行: python3 -m lark_agent_bridge listen --config config.openai.toml
# 或:   ./run.sh openai
#
# 此文件是模板，从这里复制: cp config.openai.example.toml config.openai.toml
# 模板参见: config.openai.example.toml
#
# 支持所有 OpenAI 兼容接口:
#   preset = "openai"    => api.openai.com (官方)
#   preset = "deepseek"  => api.deepseek.com (低成本)
# 或者手填 base_url + api_key 接任意兼容接口 (小米/yybb/自建等)
#   若要用 cc-switch 当前激活的 provider，改用 config.cc-switch.toml

# ------------------------------------------------------------------
# 顶层设置
# ------------------------------------------------------------------
dry_run = false
workspace_root = "../.."
guideengine_repo = "../../xp/guideengine/.worktrees/your_branch"
data_dir = "data"
allowed_chats = []
allowed_users = []

# ------------------------------------------------------------------
# Feishu Bot 身份
# 也可通过环境变量设置:
#   export LARK_AGENT_BRIDGE_BOT_OPEN_ID=ou_xxx
#   export LARK_AGENT_BRIDGE_BOT_NAME="My Feishu Bot"
# ------------------------------------------------------------------
[lark]
bot_open_id = ""
bot_name = ""

# ------------------------------------------------------------------
# AI Provider: 直连 OpenAI 兼容 API
# API key 优先从环境变量读取: export LARK_AGENT_BRIDGE_AI_API_KEY=sk-...
# ------------------------------------------------------------------
[ai_provider]
enabled = true
preset = "openai"        # 官方 OpenAI (gpt-4.1 / gpt-4o)
# 其他选项:
#   preset = "deepseek"  — DeepSeek，成本约为 OpenAI 的 1/10
# 手填任意兼容接口 (覆盖 preset):
#   base_url = "https://your-custom-endpoint/v1"
#   api_format = "openai"   # 或 "anthropic"
api_key = ""             # 强烈建议用 env: LARK_AGENT_BRIDGE_AI_API_KEY
# 性能调优
intent_timeout_seconds = 30
summary_timeout_seconds = 120
summary_max_tokens = 4096

# ------------------------------------------------------------------
# Bug 分析（subprocess 阶段用 codex/claude 跑分析脚本）
# [ai_provider] 负责: intent 分类 + 最终 summary
# ------------------------------------------------------------------
[bug_analysis]
enabled = true
provider = "codex"
timeout_seconds = 5400
agent_summary_timeout_seconds = 300

[intent_analysis]
enabled = true

[claude_agent]
enabled = true
command = "claude"
trigger_prefixes = []
working_dir = "../.."
allowed_tools = ["Read", "Grep", "Glob", "LS"]
permission_mode = "dontAsk"
timeout_seconds = 1800

[source_investigation]
enabled = true
provider = "codex"
timeout_seconds = 120

[omlx_chat]
enabled = true
base_url = "http://127.0.0.1:8000/v1"
model = "gemma-4-26b-a4b-it-4bit"
api_key = ""
timeout_seconds = 120

[knowledge]
enabled = true
storage = "data/knowledge/knowledge.sqlite"
max_hits = 5
trigger_prefixes = ["知识库", "查知识", "/kb", "/qa"]
answer_provider = "omlx"

[report_server]
enabled = true
bind_host = "0.0.0.0"
port = 8765
admin_token = ""

[approval]
enabled = false

[download]
enabled = true
max_bytes = 5368709120

[job_retention]
enabled = true
max_age_hours = 6

[notifications]
enabled = false

