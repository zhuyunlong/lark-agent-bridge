# lark-agent-bridge config — cc-switch preset
# 运行: python3 -m lark_agent_bridge listen --config config.cc-switch.toml
# 或:   ./run.sh cc-switch

[lark]
enabled = true
# 从飞书机器人平台获取这些值
bot_id = ""
bot_secret = ""
webhook_secret = ""

[ai_provider]
# 使用 cc-switch 本地代理 (127.0.0.1:15721)
# cc-switch 必须运行，且在 UI 中手动切换到想要的 provider
# (e.g. Xiaomi MiMo TP, yybb Claude, etc)
enabled = true
preset = "cc-switch"    # 零配置！cc-switch 管理 token 和 failover

[bug_analysis]
enabled = true
provider = "codex"      # 仍可选择 subprocess 路径的 codex/claude，或省略用 ai_provider

[intent_analysis]
enabled = true

[approval]
enabled = true

[report_server]
enabled = true
port = 18888

[download]
enabled = true

[job_retention]
enabled = true

[notifications]
enabled = true
