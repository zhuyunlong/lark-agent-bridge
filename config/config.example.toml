# Committed desensitized template. Copy to ../config.toml for local runtime use.
dry_run = true
workspace_root = "../.."
guideengine_repo = "../../xp/guideengine/.worktrees/os6_xpdev"
data_dir = "data"

allowed_chats = []
allowed_users = []
command_prefixes = ["/signal"]

[signal_aliases]
"LD normal" = "SIGNAL_X3D_LD_NORMAL_OVER_ALL_DATA"
"normal over all" = "SIGNAL_X3D_LD_NORMAL_OVER_ALL_DATA"
"LD tile" = "SIGNAL_X3D_LD_TILE_OVER_ALL_DATA"
"tile over all" = "SIGNAL_X3D_LD_TILE_OVER_ALL_DATA"
"SD over all" = "SIGNAL_X3D_SD_OVER_ALL_DATA"

[download]
max_bytes = 5368709120
timeout_seconds = 1800

[local_resources]
enabled = true
require_allowed_user = true
allowed_dirs = ["~/Downloads"]

[job_retention]
enabled = true
max_age_hours = 6
bug_cache_max_age_hours = 24
purge_all_on_listen_start = false
cleanup_interval_seconds = 60

[lark]
reply_in_thread = false
mention_sender_in_group = true
bot_open_id = ""
bot_name = ""

[internal_network_env]
inherit_env = [
  "PATH",
  "HOME",
  "USER",
  "LOGNAME",
  "TMPDIR",
  "TMP",
  "TEMP",
  "LANG",
  "LC_ALL",
  "LC_CTYPE",
  "SHELL",
  "TERM",
  "ANDROID_SDK_ROOT",
  "ANDROID_HOME",
  "JAVA_HOME",
]
unset_env = [
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "ALL_PROXY",
  "NO_PROXY",
  "http_proxy",
  "https_proxy",
  "all_proxy",
  "no_proxy",
]

[ai_provider]
enabled = true
preset = "deepseek-claude"
api_key = ""
intent_timeout_seconds = 30
intent_max_tokens = 4096
summary_timeout_seconds = 300
summary_max_tokens = 4096

[bug_analysis]
enabled = true
provider = ""
command = ""
model = "gpt-5.4"
working_dir = "../.."
timeout_seconds = 5400
max_prompt_chars = 16000
upload_result_files = true
default_prompt = ""
resume_followup_sessions = false
auto_fallback_to_file_agent = false
confirm_low_confidence_skill = true
force_reanalysis_terms = ["结果不合理", "信号定义", "源码", "源代码", "根据源码", "重新分析", "重新跑", "重跑", "再分析"]

[bug_analysis.app_server_investigation]
enabled = false
auto_terms = ["auto", "auto模式"]
free_terms = ["全技能自主分析", "全技能分析", "自主分析"]
require_description_for_file_resources = true
require_time_for_file_resources = true
prompt_template = """
你是通过飞书触发的 Codex app-server 自主分析 Agent。
你不能修改任何文件，只做只读分析。

必须先读取以下文件：
- 上下文说明：{context_path}
- 结构化上下文：{context_json_path}
- Skill 清单：{skill_inventory_path}
- Skill 清单 JSON：{skill_inventory_json_path}
- Log focus 清单（log_focus.md）：{log_focus_manifest}

分析要求：
1. 先做问题分类，再根据 Skill 清单选择 1 个 primary skill，最多 1 个 secondary skill，并说明选择理由；不要在配置层臆造 skill 规则。
2. 再读取对应 skill 的 SKILL.md、report_contract 和必要 references，不要一次性盲扫所有 skill。
3. 查询前先写 3-5 个假设，每个假设说明目标日志范围、关键词、要证明或排除什么。
4. 日志查询必须优先围绕 `{focused_log_input}` 和 Log focus 清单；只有证据不足或当前 skill 明确要求时，才扩展到 `{prepared_input}`。
5. 主业务包名、跨包搜索范围、系统日志路径、系统关键词和报告必备章节都以当前 skill 的 SKILL.md / references / scripts / report_contract 为准；不要在全局配置之外自行猜测。
6. 第一轮查询限定故障时间前后的小窗口；每阶段先汇总已查证据，再决定是否扩展；不要重复执行相同命令。
7. 进入更大日志范围或系统日志前，必须说明要验证的假设；日志查询必须带时间窗口和关键词，不要无目标递归扫描。
8. 源码查询必须围绕日志已命中的类名、信号名、枚举值或业务状态；不要泛扫整个仓库。
9. 若所选 skill 的 report_contract.required_sections 非空，最终 Markdown 必须按原名输出这些章节；无法闭环时写清缺口，不要省略。
10. 每个关键判断必须有 file:line 证据。只有推断时必须标注“推断”；证据不足时写“待确认”，不要强行定因。
11. 只读源码和日志，不要修改源码、日志或配置。
12. 输出中文 Markdown，必须可直接保存到 `{output_path}`。

基础输出结构：
- 结论摘要
- 调查方案
- 关键时间线
- 关键证据
- 已排除项
- 已确认链路
- 源码解释
- 待确认项
- 建议动作

最终只输出 Markdown 正文，不要输出额外解释。
"""
# 自主分析专属模型与思考深度；留空则继承 [codex_app_server] 同名配置。
model = "gpt-5.5"
reasoning_effort = "xhigh"

[intent_analysis]
enabled = true
provider = ""
command = ""
model = "gpt-5.4"
working_dir = "../.."
timeout_seconds = 180
max_prompt_chars = 12000
allow_subprocess_fallback = false

[requirement_analysis]
enabled = true
timeout_seconds = 120
fetch_comments = true
fetch_wiki_body = false
max_requirement_chars = 12000
max_fact_count = 30

[source_investigation]
enabled = true
provider = ""
command = ""
timeout_seconds = 300
repo_roots = ["../../xp/guideengine/.worktrees/os6_xpdev", "../../xp/Napa5"]
code_index_enabled = true
ctags_command = "ctags"
code_index_timeout_seconds = 10
code_index_min_confidence = 0.6
codegraph_enabled = true
codegraph_command = "codegraph"
codegraph_timeout_seconds = 10
codegraph_min_confidence = 0.6

[codex_app_server]
enabled = false
command = "codex"
min_version = "0.125.0"
use_for_file_agent = false
use_for_bug_summary = false
fallback_to_exec = true
startup_timeout_seconds = 15
turn_timeout_seconds = 600
post_tool_quiet_timeout_seconds = 90
notification_poll_seconds = 0.25
max_event_audit = 200
sandbox_mode = "read-only"
disable_node_repl = true
disable_analytics = true
disable_memories = true
disable_apps_feature = true
disable_plugins_feature = true
disable_computer_use_feature = true
preserve_proxy_env = true
reasoning_effort = "medium"
use_minimal_home = true
# use_minimal_home=true 且 source_investigation.codegraph_enabled=true 时，
# Bridge 会在临时 CODEX_HOME 中注入 bridge_codegraph MCP 工具，供 app-server
# 通过 codegraph_status/search_codegraph/get_callers/get_code_context 使用索引。

[claude_agent]
enabled = false
command = "claude"
trigger_prefixes = []
working_dir = "../.."
add_dirs = ["../.."]
allowed_tools = ["Read", "Grep", "Glob", "LS"]
permission_mode = "dontAsk"
timeout_seconds = 1800
max_prompt_chars = 12000
upload_result_file = true

[omlx_chat]
enabled = true
base_url = "http://127.0.0.1:8000/v1"
model = "gemma-4-26b-a4b-it-4bit"
api_key = "1234"
timeout_seconds = 120
max_prompt_chars = 2000
max_tokens = 1024
temperature = 0.3

[runner]
timeout_seconds = 900

[knowledge]
enabled = true
storage = "data/knowledge/knowledge.sqlite"
max_hits = 5
trigger_prefixes = ["知识库", "查知识", "/kb", "/qa"]
answer_provider = "omlx"

[[knowledge.sources]]
id = "guideengine-signals"
type = "guideengine_signal"
title = "guideengine signal source snippets"

[report_server]
enabled = true
bind_host = "0.0.0.0"
port = 8765
public_base_url = ""
admin_token = ""

[approval]
enabled = false

[notifications]
enabled = false
