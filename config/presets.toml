# Central profile registry for lark-agent-bridge.
#
# This is the single source of truth for run.sh profiles, AI provider presets,
# protocol-to-agent mapping, key requirements, and operator preconditions.
#
# To add custom presets, create a [provider_presets.<name>] section in your
# config.toml — it will be merged with (and can override) these built-ins.

[defaults]
profile = "cc-switch-deepseek-claude"

[mimo-claude]
type = "direct-api"
base_url = "https://token-plan-cn.xiaomimimo.com/anthropic"
primary_model = "mimo-v2.5-pro"
fast_model = "mimo-v2.5-pro"
api_format = "anthropic"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = true
requires_api_key = true
precondition = "Set LARK_AGENT_BRIDGE_AI_API_KEY or local [ai_provider].api_key."

[yybb-claude]
type = "direct-api"
base_url = "https://yybb.codes"
primary_model = "claude-sonnet-4-6"
fast_model = "claude-haiku-4-5-20251001"
fallback_model = "claude-opus-4-6"
api_format = "anthropic"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = true
requires_api_key = true
precondition = "Set LARK_AGENT_BRIDGE_AI_API_KEY or local [ai_provider].api_key."

[yybb-codex]
type = "direct-api"
base_url = "https://yybb.codes/v1"
primary_model = "gpt-5.4"
fast_model = "gpt-5.4-mini"
api_format = "openai"
agent_provider = "codex"
agent_command = "codex"
ai_enabled = true
requires_api_key = true
precondition = "Set LARK_AGENT_BRIDGE_AI_API_KEY or local [ai_provider].api_key."

[panda-codex]
type = "direct-api"
base_url = "https://hub.tokenpanda.top/v1"
primary_model = "gpt-5.4"
fast_model = "gpt-4.1-mini"
api_format = "openai"
agent_provider = "codex"
agent_command = "codex"
ai_enabled = true
requires_api_key = true
precondition = "Set LARK_AGENT_BRIDGE_AI_API_KEY or local [ai_provider].api_key."

[deepseek-claude]
type = "direct-api"
base_url = "https://api.deepseek.com/anthropic"
primary_model = "deepseek-v4-pro"
fast_model = "deepseek-v4-flash"
api_format = "anthropic"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = true
requires_api_key = true
precondition = "Set LARK_AGENT_BRIDGE_AI_API_KEY or local [ai_provider].api_key."

[cc-switch-deepseek-claude]
type = "cc-switch"
base_url = "http://127.0.0.1:15721"
primary_model = "deepseek-v4-pro"
fast_model = "deepseek-v4-flash"
api_format = "anthropic"
api_key = "PROXY_MANAGED"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = true
requires_api_key = false
precondition = "cc-switch must activate the claude app_type and DeepSeek provider."

[cc-switch-mimo-claude]
type = "cc-switch"
base_url = "http://127.0.0.1:15721"
primary_model = "mimo-v2.5-pro"
fast_model = "mimo-v2.5"
api_format = "anthropic"
api_key = "PROXY_MANAGED"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = true
requires_api_key = false
precondition = "cc-switch must activate the claude app_type and MiMo provider."

[cc-switch-yybb-claude]
type = "cc-switch"
base_url = "http://127.0.0.1:15721"
primary_model = "claude-sonnet-4-6"
fast_model = "claude-haiku-4-5-20251001"
fallback_model = "claude-opus-4-6"
api_format = "anthropic"
api_key = "PROXY_MANAGED"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = true
requires_api_key = false
precondition = "cc-switch must activate the claude app_type and yybb Claude provider."

[cc-switch-scihub-claude]
type = "cc-switch"
base_url = "http://127.0.0.1:15721"
primary_model = "claude-opus-4-6"
fast_model = "claude-opus-4-6"
api_format = "anthropic"
api_key = "PROXY_MANAGED"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = true
requires_api_key = false
precondition = "cc-switch must activate the claude app_type and SciHub provider."

[cc-switch-yybb-codex]
type = "cc-switch"
base_url = "http://127.0.0.1:15721"
primary_model = "gpt-5.4"
fast_model = "gpt-5.4-mini"
api_format = "openai"
api_key = "PROXY_MANAGED"
agent_provider = "codex"
agent_command = "codex"
ai_enabled = true
requires_api_key = false
precondition = "cc-switch must activate the codex app_type and yybb Codex provider."

[codex-offi]
type = "official-login"
api_format = "cli"
agent_provider = "codex"
agent_command = "codex"
ai_enabled = false
requires_api_key = false
precondition = "Local codex CLI must already be logged in."

[claude-offi]
type = "official-login"
api_format = "cli"
agent_provider = "claude"
agent_command = "claude"
ai_enabled = false
requires_api_key = false
precondition = "Local claude CLI must already be logged in."
