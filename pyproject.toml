[project]
name = "lark-agent-bridge"
version = "0.3.0"
description = "Local Feishu Bot bridge for controlled AI agent tasks."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
pydantic-ai = [
    "pydantic>=2.0",
    "pydantic-ai>=1.0",
]
all = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pydantic-ai>=1.0",
]

[tool.setuptools.package-data]
lark_agent_bridge = ["templates/*.html"]
"lark_agent_bridge.knowledge.templates" = ["*.json"]
