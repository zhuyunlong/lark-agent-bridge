dry_run = true
workspace_root = "../.."
guideengine_repo = "../../xp/guideengine/.worktrees/os6_xpdev"
data_dir = "data"

# Empty means no group restriction. Fill this list only when you want a group allowlist.
allowed_chats = []
allowed_users = []
command_prefixes = []

[signal_aliases]
"LD normal" = "SIGNAL_X3D_LD_NORMAL_OVER_ALL_DATA"
"normal over all" = "SIGNAL_X3D_LD_NORMAL_OVER_ALL_DATA"
"LD tile" = "SIGNAL_X3D_LD_TILE_OVER_ALL_DATA"
"tile over all" = "SIGNAL_X3D_LD_TILE_OVER_ALL_DATA"
"SD over all" = "SIGNAL_X3D_SD_OVER_ALL_DATA"

[download]
max_bytes = 5368709120
timeout_seconds = 60
# Allow downloading from private/internal network addresses (192.168.*, 10.*, 127.*, etc.).
# Default is true — required for internal file servers and NAS.
# Set to false only if the bridge is exposed to untrusted users.
allow_private_urls = true

[local_resources]
# Security gate for local files mentioned in chat.
# A local file is only resolved when:
#   1. The sender is in `allowed_users` when `require_allowed_user = true`.
#   2. The message explicitly mentions 下载目录 / Downloads / 服务器下载目录.
#   3. The filename exists under one of the allowed_dirs.
enabled = true
require_allowed_user = true
allowed_dirs = ["~/Downloads"]

[job_retention]
enabled = true
# Historical analysis jobs/reports are preserved; this age only applies to temporary Bug cache.
max_age_hours = 6
bug_cache_max_age_hours = 24
purge_all_on_listen_start = false
cleanup_interval_seconds = 60

[event_consumer]
# The bridge listens to one EventKey per lark-cli subprocess.
# The default message listener does not receive card button callbacks; cards
# hide callback-only buttons unless the deployment separately consumes
# card.action.trigger.
event_key = "im.message.receive_v1"
# `lark-cli event consume` must emit `[event] ready event_key=...` on stderr
# before the bridge starts treating the listener as healthy.
ready_timeout_seconds = 30
# Restart only non-zero / startup failures. Graceful exit code 0 is not restarted.
restart_on_failure = true
# 0 means unlimited restarts with backoff.
max_restarts = 0
restart_initial_delay_seconds = 1
restart_max_delay_seconds = 60
# When lark-cli reconnects it can replay old lightweight messages. Drop stale
# help/identity/chat messages created before listener readiness; analysis requests
# with Bug links, logs, files, signals, or follow-up context are still processed.
drop_stale_light_interactions = true
stale_light_interaction_grace_seconds = 120

[lark]
reply_in_thread = false
mention_sender_in_group = true
# Optional: prefer environment variables for identifiers in shared repos.
#   export LARK_AGENT_BRIDGE_BOT_OPEN_ID="ou_xxx"
#   export LARK_AGENT_BRIDGE_BOT_NAME="My Feishu CLI Bot"
bot_open_id = ""
bot_name = ""

[claude_agent]
# Optional compatibility route. Empty trigger_prefixes means the bot does not
# expose legacy local skill-analysis chat triggers by default.
enabled = true
command = "claude"
trigger_prefixes = []
working_dir = "../.."
add_dirs = ["../.."]
allowed_tools = ["Read", "Grep", "Glob", "LS"]
permission_mode = "dontAsk"
timeout_seconds = 1800
max_prompt_chars = 12000
upload_result_file = true

[bug_analysis]
enabled = true
# Default Bug agent:
# - provider = "codex"  -> prefer local Codex first
# - provider = "claude" -> prefer local Claude Code first
# If the preferred provider cannot start or fails during the final summary step,
# the bridge automatically falls back to the other one.
provider = "codex"
command = "codex"
model = "gpt-5.4"
working_dir = "../.."
timeout_seconds = 5400
# Final Agent summary is an enhancement step. Use a longer idle window so
# Codex/Claude can finish large log/source reads before falling back.
agent_summary_timeout_seconds = 300
max_prompt_chars = 16000
upload_result_files = true
# Leave empty so generic bug links ask for a concrete direction instead of
# silently defaulting to a startup analysis.
default_prompt = ""
# Default false: follow-up and reanalysis create a fresh Agent session and reuse
# cached bug/log/source metadata instead of resuming a large old Agent context.
# Set true only when you explicitly need to continue the old Agent's private reasoning state.
resume_followup_sessions = false
# Terms that force a follow-up into reanalysis instead of answering from existing report context.
force_reanalysis_terms = ["结果不合理", "信号定义", "源码", "源代码", "根据源码", "重新分析", "重新跑", "重跑", "再分析"]

[intent_analysis]
enabled = false
model = "gpt-5.4"
# Leave provider/command empty to reuse [bug_analysis].
# When enabled:
# - the preferred provider is chosen by provider/command here
# - if left empty, it reuses [bug_analysis]
# - if the preferred provider is unavailable, the bridge tries the other one
provider = ""
command = ""
working_dir = "../.."
timeout_seconds = 180
max_prompt_chars = 12000

[omlx_chat]
enabled = true
base_url = "http://127.0.0.1:8000/v1"
model = "gemma-4-26b-a4b-it-4bit"
# Prefer environment variables for secrets in real deployments.
#   export LARK_AGENT_BRIDGE_OMLX_API_KEY="your-local-api-key"
api_key = ""
timeout_seconds = 120
max_prompt_chars = 2000
followup_max_context_chars = 12000
followup_max_history_turns = 6
max_tokens = 1024
temperature = 0.3

[knowledge]
# Personal knowledge-base QA. Chinese triggers such as `知识库` and `查知识`
# are routed before ordinary omlx chat. `/kb` and `/qa` remain compatibility
# aliases. Fuzzy ADB signal simulation questions use deterministic templates
# when source evidence is available. HTTP reads auto-sync a fresh index, and
# source-derived answers are recorded under `derived-adb-simulations`.
enabled = true
storage = "data/knowledge/knowledge.sqlite"
max_hits = 5
trigger_prefixes = ["知识库", "查知识", "/kb", "/qa"]
answer_provider = "omlx"
# Auto-probe lets clear internal operation questions use knowledge QA without
# requiring the explicit "知识库" prefix. Keep only generic action terms here.
# Business aliases, signal names, code/format/value mappings, and exclusions
# belong in the template data, not in Python or this routing list.
auto_probe_enabled = true
auto_probe_min_score = 6.0
auto_probe_intent_terms = ["模拟", "命令", "指令", "广播", "mock", "adb", "构造", "造数据", "造"]
auto_probe_no_hit_terms = ["模拟", "命令", "指令", "广播", "mock", "adb", "构造", "造数据", "造"]

[[knowledge.sources]]
id = "guideengine-adb"
type = "local_json"
path = "/Users/zhuyl/Documents/workspace/xp/guideengine/.worktrees/os6_xpdev/config/adb/adb_data.json"
title = "guideengine ADB 命令"

[[knowledge.sources]]
id = "guideengine-base"
