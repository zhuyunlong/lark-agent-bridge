dry_run = true
workspace_root = "../.."
guideengine_repo = "../../xp/guideengine/.worktrees/os6_xpdev"
data_dir = "data"

# Empty means no group restriction. Fill this list only when you want a group allowlist.
allowed_chats = []
allowed_users = []
command_prefixes = ["/signal"]

[signal_aliases]
"LD normal" = "SIGNAL_X3D_LD_NORMAL_OVER_ALL_DATA"
"normal over all" = "SIGNAL_X3D_LD_NORMAL_OVER_ALL_DATA"
"LD tile" = "SIGNAL_X3D_LD_TILE_OVER_ALL_DATA"
"tile over all" = "SIGNAL_X3D_LD_TILE_OVER_ALL_DATA"
"SD over all" = "SIGNAL_X3D_SD_OVER_ALL_DATA"

[download]
max_bytes = 5368709120
timeout_seconds = 60

[local_resources]
# Security gate for local files mentioned in chat.
# A local file is only resolved when:
#   1. The sender is in `allowed_users` when `require_allowed_user = true`.
#   2. The message explicitly mentions 下载目录 / Downloads / 服务器下载目录.
#   3. The filename exists under one of the allowed_dirs.
enabled = true
require_allowed_user = true
allowed_dirs = ["~/Downloads"]

[job_retention]
enabled = true
# Historical analysis jobs/reports are preserved; this age only applies to temporary Bug cache.
max_age_hours = 6
bug_cache_max_age_hours = 24
purge_all_on_listen_start = false
cleanup_interval_seconds = 60

[event_consumer]
# The bridge listens to one EventKey per lark-cli subprocess.
event_key = "im.message.receive_v1"
# `lark-cli event consume` must emit `[event] ready event_key=...` on stderr
# before the bridge starts treating the listener as healthy.
ready_timeout_seconds = 30
# Restart only non-zero / startup failures. Graceful exit code 0 is not restarted.
restart_on_failure = true
# 0 means unlimited restarts with backoff.
max_restarts = 0
restart_initial_delay_seconds = 1
restart_max_delay_seconds = 60

[lark]
reply_in_thread = false
mention_sender_in_group = true
# Optional: prefer environment variables for identifiers in shared repos.
#   export LARK_AGENT_BRIDGE_BOT_OPEN_ID="ou_xxx"
#   export LARK_AGENT_BRIDGE_BOT_NAME="My Feishu CLI Bot"
bot_open_id = ""
bot_name = ""

[claude_agent]
enabled = true
command = "claude"
trigger_prefixes = ["/skill", "/claude"]
working_dir = "../.."
add_dirs = ["../.."]
allowed_tools = ["Read", "Grep", "Glob", "LS"]
permission_mode = "dontAsk"
timeout_seconds = 1800
max_prompt_chars = 12000
upload_result_file = true

[bug_analysis]
enabled = true
# Default Bug agent:
# - provider = "codex"  -> prefer local Codex first
# - provider = "claude" -> prefer local Claude Code first
# If the preferred provider cannot start or fails during the final summary step,
# the bridge automatically falls back to the other one.
provider = "codex"
command = "codex"
working_dir = "../.."
timeout_seconds = 5400
# Final Agent summary is an enhancement step. Keep it short so generated HTML
# and script summaries can be returned even if Codex/Claude is slow.
agent_summary_timeout_seconds = 90
max_prompt_chars = 16000
upload_result_files = true
# Leave empty so generic bug links ask for a concrete direction instead of
# silently defaulting to a startup analysis.
default_prompt = ""
# Default false: follow-up and reanalysis create a fresh Agent session and reuse
# cached bug/log/source metadata instead of resuming a large old Agent context.
# Set true only when you explicitly need to continue the old Agent's private reasoning state.
resume_followup_sessions = false
# Terms that force a follow-up into reanalysis instead of answering from existing report context.
force_reanalysis_terms = ["结果不合理", "信号定义", "源码", "源代码", "根据源码", "重新分析", "重新跑", "重跑", "再分析"]

[intent_analysis]
enabled = false
# Leave provider/command empty to reuse [bug_analysis].
# When enabled:
# - the preferred provider is chosen by provider/command here
# - if left empty, it reuses [bug_analysis]
# - if the preferred provider is unavailable, the bridge tries the other one
provider = ""
command = ""
working_dir = "../.."
timeout_seconds = 180
max_prompt_chars = 12000

[omlx_chat]
enabled = true
base_url = "http://127.0.0.1:8000/v1"
model = "gemma-4-26b-a4b-it-4bit"
# Prefer environment variables for secrets in real deployments.
#   export LARK_AGENT_BRIDGE_OMLX_API_KEY="your-local-api-key"
api_key = ""
timeout_seconds = 120
max_prompt_chars = 2000
followup_max_context_chars = 12000
followup_max_history_turns = 6
max_tokens = 1024
temperature = 0.3

[report_server]
enabled = true
bind_host = "0.0.0.0"
port = 8765
# Optional: override with an externally reachable URL when running behind a reverse proxy.
#   export LARK_AGENT_BRIDGE_REPORT_PUBLIC_BASE_URL="https://bridge.example.com/reports"
# Leave empty to auto-publish the current LAN IP, for example `http://10.x.x.x:8765/reports`.
# The same HTTP listener also serves the local session console at `/sessions`.
public_base_url = ""

[approval]
# Medium/high-risk operations such as bug analysis, direct file analysis and reanalysis
# pause on an interactive confirmation card before execution. Keep this disabled
# unless the deployment has a real card callback ingress wired into the bridge.
enabled = false

[workflow_archive]
# Best-effort Base/Doc/Drive archival. Leave disabled until the target Base table
# fields and Drive/Doc folder permissions are ready for the bot identity.
enabled = false
base_token = ""
table_id = ""
drive_folder_token = ""
doc_parent_token = ""

[workflow_archive.base_field_map]
job_id = "任务ID"
mode = "分析类型"
status = "状态"
summary = "结论摘要"
report_url = "报告链接"
bug_url = "Bug链接"
provider = "Agent"
duration_seconds = "耗时秒"
chat_id = "群ID"
sender_id = "发起人"
doc_url = "Doc链接"
report_version = "报告版本"

[notifications]
# Optional proactive pushes. Disabled by default to avoid duplicate group noise.
enabled = false
report_ready = true

[dual_agent]
# When enabled, the bridge arbitrates primary result text against
# `secondary_agent_summary` if a runner provides it.
enabled = false

[runner]
timeout_seconds = 900
