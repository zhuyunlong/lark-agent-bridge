[source_investigation]
# Read-only Codex CLI fallback for explicit source-investigation knowledge
# requests such as "源码调查/查源码/基于源码". Ordinary fuzzy signal questions
# should answer from verified/source-derived templates first. This path is intended
# only for short source investigations; large logs and long reports stay on the
# existing bug-analysis path.
enabled = true
provider = "codex"
command = "codex"
model = "gpt-5.4"
fallback_model = "gpt-5.3-codex"
timeout_seconds = 120
max_evidence = 20
repo_roots = ["/Users/zhuyl/Documents/workspace/xp/guideengine/.worktrees/os6_xpdev"]
# Add extra read-only roots for cross-repo source lookup when needed, for example Napa5.
add_dirs = []

[report_server]
enabled = true
bind_host = "0.0.0.0"
port = 8765
# Admin API authentication token.
# When set, all write operations (terminate, delete, skill CRUD) require
# the Authorization header: `Authorization: Bearer <admin_token>`.
# You can also create user accounts via the admin UI once authenticated.
# Prefer environment variable for secrets:
#   export LARK_AGENT_BRIDGE_ADMIN_TOKEN="your-secret-token"
admin_token = ""
# Optional: override with an externally reachable URL when running behind a reverse proxy.
#   export LARK_AGENT_BRIDGE_REPORT_PUBLIC_BASE_URL="https://bridge.example.com/reports"
# Leave empty to auto-publish the current LAN IP, for example `http://10.x.x.x:8765/reports`.
# The same HTTP listener also serves the local session console at `/sessions`.
public_base_url = ""

[approval]
# Medium/high-risk operations such as bug analysis, direct file analysis and reanalysis
# pause on an interactive confirmation card before execution. Keep this disabled
# unless the deployment has a real card callback ingress wired into the bridge.
enabled = false

[workflow_archive]
# Best-effort Base/Doc/Drive archival. Leave disabled until the target Base table
# fields and Drive/Doc folder permissions are ready for the bot identity.
enabled = false
base_token = ""
table_id = ""
drive_folder_token = ""
doc_parent_token = ""

[workflow_archive.base_field_map]
